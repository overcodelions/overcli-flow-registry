name: "Incident postmortem from notes"
description: "Gather the incident record, build a timeline and root-cause analysis, draft the postmortem, critique it for blamelessness and completeness, then finalize"
input: user_prompt
default_prompt: |-
  Write a postmortem for this incident:

  <paste incident summary or link here>
participants:
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: analyst
    name: Analyst
    backend: claude
    model: claude-fable-5
    kind: custom
  - id: writer
    name: Writer
    backend: codex
    model: gpt-5.6-terra
    kind: worker
  - id: reviewer
    name: Reviewer
    backend: claude
    model: claude-opus-5
    kind: reviewer
steps:
  - id: gather
    participant: scout
    role: researcher
    inputs: [user_prompt]
    tools: [Read, Grep, Glob, Bash, WebFetch]
    output: record.md
  - id: analyze
    participant: analyst
    role: planner
    inputs: [user_prompt, record.md]
    tools: [Read, Grep, Glob]
    output: analysis.md
  - id: draft
    participant: writer
    role: technical-writer
    inputs: [user_prompt, record.md, analysis.md]
    tools: [Read, Glob, Write]
    permission_mode: acceptEdits
    output: draft.md
  # A reviewer-role step GATES the run: the runtime treats "no APPROVED"
  # line as a step failure, and what a critic emits is a verdict, not a
  # document. So the critic produces critique.md and hands off — approved or
  # not — to a finalize pass that produces the actual deliverable.
  - id: review
    participant: reviewer
    role: reviewer
    inputs: [user_prompt, analysis.md, draft.md]
    tools: [Read, Grep, Glob]
    on_fail:
      action: goto
      target: finalize
      max_retries: 1
    output: critique.md
  - id: finalize
    participant: writer
    role: editor
    inputs: [user_prompt, analysis.md, draft.md, critique.md]
    tools: [Read, Grep, Glob]
    output: postmortem.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.2.0
tags: [operations, docs, infra, claude, codex]
