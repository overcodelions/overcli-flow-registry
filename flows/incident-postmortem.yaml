name: "Incident postmortem from notes"
description: "Gather the incident record, build a timeline and root-cause analysis, draft the postmortem, then review for blamelessness and completeness"
input: user_prompt
default_prompt: |-
  Write a postmortem for this incident:

  <paste incident summary or link here>
participants:
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: analyst
    name: Analyst
    backend: claude
    model: claude-fable-5
    kind: custom
  - id: writer
    name: Writer
    backend: codex
    model: gpt-5.6-terra
    kind: worker
  - id: reviewer
    name: Reviewer
    backend: claude
    model: claude-opus-5
    kind: reviewer
steps:
  - id: gather
    participant: scout
    role: researcher
    inputs: [user_prompt]
    tools: [Read, Grep, Glob, Bash, WebFetch]
    output: record.md
  - id: analyze
    participant: analyst
    role: planner
    inputs: [user_prompt, record.md]
    tools: [Read, Grep, Glob]
    output: analysis.md
  - id: draft
    participant: writer
    role: technical-writer
    inputs: [user_prompt, record.md, analysis.md]
    tools: [Read, Glob, Write]
    permission_mode: acceptEdits
    output: draft.md
  - id: review
    participant: reviewer
    role: reviewer
    inputs: [user_prompt, analysis.md, draft.md]
    tools: [Read, Grep, Glob]
    output: postmortem.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.1.0
tags: [operations, docs, infra, claude, codex]
