name: "Debug CI failure"
description: "Gather CI logs + config, diagnose root cause, then propose a concrete fix"
input: user_prompt
default_prompt: |-
  CI failed. Investigate and propose a fix:

  <paste CI failure output or link here>
participants:
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: diagnostician
    name: Diagnostician
    backend: claude
    model: claude-opus-5
    kind: reviewer
  - id: fixer
    name: Fixer
    backend: codex
    model: gpt-5.6-terra
    kind: worker
steps:
  - id: gather
    participant: scout
    role: researcher
    inputs: [user_prompt]
    tools: [Bash, Read, Grep, Glob, WebFetch]
    output: context.md
  - id: diagnose
    participant: diagnostician
    role: debugger
    inputs: [user_prompt, context.md]
    tools: [Read, Grep, Glob, Bash]
    output: diagnosis.md
  - id: propose-fix
    participant: fixer
    role: implementer
    inputs: [user_prompt, diagnosis.md, context.md]
    tools: [Read, Glob, Grep, Write, Edit, Bash]
    output: fix.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.1.0
tags: [debugging, ci, devops, claude, codex]
