name: "Debug Error Logs"
description: "Diagnose error logs, locate the failing code, draft a fix, then verify the fix with an independent reviewer"
input: user_prompt
default_prompt: |-
  Diagnose this error and propose a fix:

  <paste error logs here>
participants:
  - id: diagnostician
    name: Diagnostician
    backend: claude
    model: claude-opus-5
    kind: primary
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5
    kind: custom
  - id: fixer
    name: Fixer
    backend: codex
    model: gpt-5.6-terra
    kind: worker
  - id: verifier
    name: Verifier
    backend: claude
    model: claude-opus-5
    kind: reviewer
steps:
  - id: diagnose
    participant: diagnostician
    role: debugger
    inputs: [user_prompt]
    tools: [Read, Grep, Glob]
    output: diagnosis.md
  - id: locate
    participant: scout
    role: researcher
    inputs: [user_prompt, diagnosis.md]
    tools: [Read, Grep, Glob, Bash]
    output: locations.md
  - id: fix
    participant: fixer
    role: implementer
    inputs: [user_prompt, diagnosis.md, locations.md]
    tools: [Read, Glob, Grep, Write, Edit, Bash]
    output: patch.md
  - id: verify
    participant: verifier
    role: reviewer
    inputs: [user_prompt, diagnosis.md, patch.md]
    tools: [Read, Grep, Glob, Bash]
    output: report.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.1.0
tags: [debugging, logs, repo, claude, codex]
