name: "Jira ticket to PR"
description: "Fetch the ticket, design a plan, implement with a critic loop, then fix and review in a loop until the review approves, then open a PR on approval"
input: user_prompt
default_prompt: |-
  Implement this Jira ticket and open a PR:

  <paste Jira ticket key or URL here>
participants:
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5-5
    kind: primary
  - id: lead
    name: Lead
    backend: claude
    model: claude-opus-5-5
    kind: reviewer
  - id: builder
    name: Builder
    backend: codex
    model: gpt-6.1-terra
    kind: worker
  - id: shipper
    name: Shipper
    backend: claude
    model: claude-sonnet-5-5
    kind: custom
steps:
  - id: fetch
    participant: scout
    role: researcher
    inputs: [user_prompt]
    tools: [mcp:atlassian]
    effect: local
    output: ticket.md
  - id: plan
    participant: lead
    role: planner
    inputs: [user_prompt, ticket.md]
    tools: [Read, Grep, Glob]
    effect: local
    output: plan.md
  - id: build
    participant: builder
    role: implementer
    inputs: [user_prompt, ticket.md, plan.md]
    tools: [Read, Glob, Grep, Write, Edit, Bash]
    rebound:
      critic: { backend: claude, model: claude-opus-5-5 }
      mode: review
      max_iters: 2
    effect: local
    output: diff
  - id: fix
    participant: builder
    role: custom
    system_prompt: |-
      You are the FIX step of a multi-stage automated flow. It runs right
      after the build, and again each time the REVIEW step sends the work
      back.

      If the review sent you back, its report is in your input: fix exactly
      the blocking problems it names, and name the finding you are
      addressing with each change. Otherwise, run the project's build and
      tests and fix any failure the change caused. If everything passes,
      change NOTHING and reply "No changes required."

      Do not re-implement the plan, refactor, or add scope nobody asked for.
      Finish by running the build or tests again and quoting the result.
      Summarize what you changed file by file, one line per file.
    inputs: [user_prompt, plan.md, diff]
    tools: [Read, Glob, Grep, Write, Edit, Bash]
    effect: local
    output: diff
  - id: review
    participant: lead
    role: reviewer
    inputs: [user_prompt, plan.md, diff]
    tools: [Read, Grep, Glob, Bash]
    # Loop: a rejecting review goes back to FIX with this review, then the
    # review runs again. After three rounds the run pauses for a person
    # instead of shipping unapproved work.
    on_fail:
      action: goto
      target: fix
      max_retries: 3
    effect: local
    output: review.md
  - id: ship
    participant: shipper
    role: shipper
    inputs: [user_prompt, plan.md, diff, review.md]
    tools: [Bash]
    pause_before: true
    effect: external
    output: pr_url
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.3.0
tags: [tickets, implementation, mcp-jira, claude, codex]
