name: "Jira ticket to PR"
description: "Fetch the ticket, design a plan, implement with a critic loop, review with auto-bounce, then open a PR on approval"
input: user_prompt
default_prompt: |-
  Implement this Jira ticket and open a PR:

  <paste Jira ticket key or URL here>
participants:
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: lead
    name: Lead
    backend: claude
    model: claude-opus-5
    kind: reviewer
  - id: builder
    name: Builder
    backend: codex
    model: gpt-5.6-terra
    kind: worker
  - id: shipper
    name: Shipper
    backend: claude
    model: claude-sonnet-5
    kind: custom
steps:
  - id: fetch
    participant: scout
    role: researcher
    inputs: [user_prompt]
    tools: [mcp:atlassian]
    output: ticket.md
  - id: plan
    participant: lead
    role: planner
    inputs: [user_prompt, ticket.md]
    tools: [Read, Grep, Glob]
    output: plan.md
  - id: build
    participant: builder
    role: implementer
    inputs: [user_prompt, ticket.md, plan.md]
    tools: [Read, Glob, Grep, Write, Edit, Bash]
    rebound:
      critic: { backend: claude, model: claude-opus-5 }
      mode: review
      max_iters: 2
    output: diff
  - id: review
    participant: lead
    role: reviewer
    inputs: [user_prompt, plan.md, diff]
    tools: [Read, Grep, Glob, Bash]
    on_fail:
      action: goto
      target: build
      max_retries: 2
    output: review.md
  - id: ship
    participant: shipper
    role: shipper
    inputs: [user_prompt, plan.md, diff, review.md]
    tools: [Bash]
    pause_before: true
    output: pr_url
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.1.0
tags: [tickets, implementation, mcp-jira, claude, codex]
