name: "Coverage gap report"
description: "Diff recent changes, analyze test coverage, then format a gap report ranked by risk"
input: user_prompt
default_prompt: "Analyze test coverage gaps in recent code changes and prioritize by risk."
participants:
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: analyst
    name: Analyst
    backend: claude
    model: claude-opus-5
    kind: reviewer
  - id: writer
    name: Writer
    backend: claude
    model: claude-sonnet-5
    kind: worker
steps:
  - id: diff
    participant: scout
    role: researcher
    inputs: [user_prompt]
    tools: [Bash, Read, Grep, Glob]
    output: changes.md
  # Reviewer-role steps GATE the run: the runtime treats "no APPROVED line"
  # as a step failure. Reporting coverage gaps is this step's job, not a
  # failure, so it hands off forward rather than parking the run and leaving
  # `format` unreachable.
  - id: analyze
    participant: analyst
    role: reviewer
    inputs: [user_prompt, changes.md]
    tools: [Bash, Read, Grep, Glob]
    on_fail:
      action: goto
      target: format
      max_retries: 1
    output: gaps.md
  - id: format
    participant: writer
    role: technical-writer
    inputs: [user_prompt, gaps.md]
    tools: [Read, Write]
    permission_mode: acceptEdits
    output: report.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.2.0
tags: [testing, analysis, repo, claude]
