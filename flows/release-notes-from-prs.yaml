name: "Release notes from PRs"
description: "Gather merged PRs since last tag, categorize, then write user-facing release notes"
input: user_prompt
default_prompt: "Generate release notes for PRs merged since the last release tag."
participants:
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: categorizer
    name: Categorizer
    backend: claude
    model: claude-sonnet-5
    kind: worker
  - id: writer
    name: Writer
    backend: claude
    model: claude-opus-5
    kind: reviewer
steps:
  - id: gather
    participant: scout
    role: researcher
    inputs: [user_prompt]
    tools: [Bash]
    output: prs.md
  - id: categorize
    participant: categorizer
    role: researcher
    inputs: [user_prompt, prs.md]
    tools: [Bash, Read]
    output: categories.md
  - id: write
    participant: writer
    role: technical-writer
    inputs: [user_prompt, prs.md, categories.md]
    tools: [Read, Write]
    permission_mode: acceptEdits
    output: notes.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.1.0
tags: [release, prs, repo, claude]
