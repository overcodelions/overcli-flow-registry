name: "Estimate Jira ticket"
description: "Fetch the ticket, scope it against the repo, weigh risks, then deliver story points with rationale"
input: user_prompt
default_prompt: "Estimate the effort and story points for this ticket by analyzing its scope, dependencies, and technical complexity."
participants:
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: estimator
    name: Estimator
    backend: claude
    model: claude-opus-5
    kind: reviewer
  - id: writer
    name: Writer
    backend: claude
    model: claude-sonnet-5
    kind: worker
steps:
  - id: fetch
    participant: scout
    role: researcher
    inputs: [user_prompt]
    tools: [mcp:atlassian]
    output: ticket.md
  - id: research
    participant: scout
    role: researcher
    inputs: [user_prompt, ticket.md]
    tools: [Read, Grep, Glob, Bash]
    output: research.md
  - id: estimate
    participant: estimator
    role: planner
    inputs: [user_prompt, ticket.md, research.md]
    tools: [Read, Grep, Glob]
    output: estimate.md
  - id: format
    participant: writer
    role: technical-writer
    inputs: [user_prompt, estimate.md]
    tools: [Read, Write]
    permission_mode: acceptEdits
    output: report.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.1.0
tags: [planning, tickets, mcp-jira, claude]
