name: "Flaky test hunter"
description: "Gather CI logs, identify flaky tests, diagnose causes, then draft fixes"
input: user_prompt
default_prompt: "Find flaky tests in this repo and propose fixes."
participants:
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: diagnostician
    name: Diagnostician
    backend: claude
    model: claude-opus-5
    kind: reviewer
  - id: fixer
    name: Fixer
    backend: codex
    model: gpt-5.6-terra
    kind: worker
steps:
  - id: gather
    participant: scout
    role: researcher
    inputs: [user_prompt]
    tools: [Bash, Read, Grep, Glob]
    output: logs.md
  - id: identify
    participant: diagnostician
    role: debugger
    inputs: [user_prompt, logs.md]
    tools: [Bash, Read, Grep, Glob]
    output: flakes.md
  - id: diagnose
    participant: diagnostician
    role: debugger
    inputs: [user_prompt, flakes.md]
    tools: [Read, Grep, Glob, Bash]
    output: diagnosis.md
  - id: propose-fix
    participant: fixer
    role: implementer
    inputs: [user_prompt, diagnosis.md]
    tools: [Read, Glob, Grep, Write, Edit, Bash]
    output: report.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.1.0
tags: [testing, ci, debugging, claude, codex]
