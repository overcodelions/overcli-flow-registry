name: "Close stale issues"
description: "List issues, filter for staleness, draft close comments, then post on approval"
input: user_prompt
default_prompt: "Find stale issues in this repo and propose closure messages."
participants:
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: filterer
    name: Filterer
    backend: claude
    model: claude-sonnet-5
    kind: worker
  - id: writer
    name: Writer
    backend: claude
    model: claude-opus-5
    kind: reviewer
steps:
  - id: list
    participant: scout
    role: researcher
    inputs: [user_prompt]
    tools: [Bash]
    output: issues.md
  - id: filter
    participant: filterer
    role: researcher
    inputs: [user_prompt, issues.md]
    tools: [Bash, Read, Grep]
    output: stale.md
  - id: draft
    participant: writer
    role: technical-writer
    inputs: [user_prompt, stale.md]
    tools: [Read]
    output: comments.md
  - id: post
    participant: scout
    role: shipper
    inputs: [user_prompt, stale.md, comments.md]
    tools: [Bash]
    pause_before: true
    output: actions.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.1.0
tags: [operations, issues, repo, claude]
