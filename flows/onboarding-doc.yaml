name: "Onboarding doc"
description: "Survey the repo, outline an onboarding guide, draft each section, then polish"
input: user_prompt
default_prompt: "Write an onboarding doc for engineers new to this project."
participants:
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: planner
    name: Planner
    backend: claude
    model: claude-opus-5
    kind: custom
  - id: writer
    name: Writer
    backend: codex
    model: gpt-5.6-terra
    kind: worker
  - id: editor
    name: Editor
    backend: claude
    model: claude-opus-5
    kind: reviewer
steps:
  - id: survey
    participant: scout
    role: researcher
    inputs: [user_prompt]
    tools: [Read, Grep, Glob, Bash]
    output: survey.md
  - id: outline
    participant: planner
    role: planner
    inputs: [user_prompt, survey.md]
    tools: [Read, Grep, Glob]
    output: outline.md
  - id: draft
    participant: writer
    role: technical-writer
    inputs: [user_prompt, survey.md, outline.md]
    tools: [Read, Glob, Grep, Write]
    permission_mode: acceptEdits
    output: draft.md
  - id: polish
    participant: editor
    role: editor
    inputs: [user_prompt, outline.md, draft.md]
    tools: [Read, Grep, Glob]
    output: onboarding.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.1.0
tags: [documentation, docs, repo, claude, codex]
