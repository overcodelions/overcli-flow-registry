name: "Changelog from commits"
description: "Pull recent commits, group by conventional type, then emit polished CHANGELOG entries"
input: user_prompt
default_prompt: "Generate a changelog entry from commits since the last tag."
participants:
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: categorizer
    name: Categorizer
    backend: claude
    model: claude-sonnet-5
    kind: reviewer
  - id: writer
    name: Writer
    backend: codex
    model: gpt-5.6-terra
    kind: worker
steps:
  - id: gather
    participant: scout
    role: researcher
    inputs: [user_prompt]
    tools: [Bash]
    output: commits.md
  - id: categorize
    participant: categorizer
    role: researcher
    inputs: [user_prompt, commits.md]
    tools: [Bash, Read]
    output: grouped.md
  - id: format
    participant: writer
    role: technical-writer
    inputs: [user_prompt, commits.md, grouped.md]
    tools: [Read, Write, Edit]
    permission_mode: acceptEdits
    output: changelog.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.1.0
tags: [documentation, repo, release, claude, codex]
