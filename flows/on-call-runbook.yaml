name: "On-call runbook"
description: "Read the incident write-up, extract canonical steps, draft a runbook, critique it for completeness, then fold the critique into a final runbook"
input: user_prompt
default_prompt: |-
  Write an on-call runbook for:

  <describe the service or alert here>
participants:
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: planner
    name: Planner
    backend: claude
    model: claude-opus-5
    kind: custom
  - id: writer
    name: Writer
    backend: codex
    model: gpt-5.6-terra
    kind: worker
  - id: reviewer
    name: Reviewer
    backend: claude
    model: claude-opus-5
    kind: reviewer
steps:
  - id: read
    participant: scout
    role: researcher
    inputs: [user_prompt]
    tools: [Read, Grep, Glob, WebFetch]
    output: incident.md
  - id: extract
    participant: planner
    role: planner
    inputs: [user_prompt, incident.md]
    tools: [Read, Grep, Glob]
    output: steps.md
  - id: draft
    participant: writer
    role: technical-writer
    inputs: [user_prompt, incident.md, steps.md]
    tools: [Read, Glob, Write]
    permission_mode: acceptEdits
    output: draft.md
  # A reviewer-role step GATES the run: the runtime treats "no APPROVED"
  # line as a step failure, and what a critic emits is a verdict, not a
  # document. So the critic produces critique.md and hands off — approved or
  # not — to a finalize pass that produces the actual deliverable.
  - id: review
    participant: reviewer
    role: reviewer
    inputs: [user_prompt, steps.md, draft.md]
    tools: [Read, Grep, Glob]
    on_fail:
      action: goto
      target: finalize
      max_retries: 1
    output: critique.md
  - id: finalize
    participant: writer
    role: editor
    inputs: [user_prompt, steps.md, draft.md, critique.md]
    tools: [Read, Grep, Glob]
    output: runbook.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.2.0
tags: [operations, docs, infra, claude, codex]
