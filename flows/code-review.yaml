name: "Code Review"
description: "Survey the diff, review for correctness and security with independent reviewers, adversarially verify the findings, then format a final report"
input: user_prompt
default_prompt: "Review the current branch's changes for correctness and security issues."
participants:
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: correctness
    name: Correctness reviewer
    backend: claude
    model: claude-opus-5
    kind: custom
  - id: security
    name: Security reviewer
    backend: claude
    model: claude-opus-5
    kind: custom
  - id: verifier
    name: Verifier
    backend: claude
    model: claude-opus-5
    kind: reviewer
  - id: writer
    name: Writer
    backend: claude
    model: claude-sonnet-5
    kind: worker
steps:
  - id: survey
    participant: scout
    role: researcher
    inputs: [user_prompt]
    tools: [Bash, Read, Grep, Glob]
    output: survey.md
  # Reviewer-role steps GATE the run: the runtime treats "no APPROVED line"
  # as a step failure. For a flow whose whole deliverable is a list of
  # findings, finding something is the expected outcome, not a failure — so
  # each reviewer hands off forward instead of parking the run and leaving
  # `format` unreachable.
  - id: review-correctness
    participant: correctness
    role: code-reviewer
    inputs: [user_prompt, survey.md]
    tools: [Read, Grep, Glob, Bash]
    on_fail:
      action: goto
      target: review-security
      max_retries: 1
    output: correctness.md
  - id: review-security
    participant: security
    role: security-reviewer
    inputs: [user_prompt, survey.md]
    tools: [Read, Grep, Glob, Bash]
    on_fail:
      action: goto
      target: verify
      max_retries: 1
    output: security.md
  - id: verify
    participant: verifier
    role: adversarial-reviewer
    inputs: [user_prompt, survey.md, correctness.md, security.md]
    tools: [Read, Grep, Glob, Bash]
    on_fail:
      action: goto
      target: format
      max_retries: 1
    output: verified.md
  - id: format
    participant: writer
    role: technical-writer
    inputs: [user_prompt, verified.md]
    tools: [Read, Write]
    permission_mode: acceptEdits
    output: review.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.2.0
tags: [review, prs, repo, claude]
