name: "Weekly status report"
description: "Pull 7d of Jira activity, summarize themes, then format a status report"
input: user_prompt
default_prompt: "Generate a status report for the past 7 days covering project progress, blockers, and team themes."
participants:
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: analyst
    name: Analyst
    backend: claude
    model: claude-opus-5
    kind: reviewer
  - id: writer
    name: Writer
    backend: claude
    model: claude-sonnet-5
    kind: worker
steps:
  - id: fetch
    participant: scout
    role: researcher
    inputs: [user_prompt]
    tools: [mcp:atlassian]
    output: activity.md
  - id: summarize
    participant: analyst
    role: researcher
    inputs: [user_prompt, activity.md]
    tools: [mcp:atlassian]
    output: summary.md
  - id: format
    participant: writer
    role: technical-writer
    inputs: [user_prompt, activity.md, summary.md]
    tools: [Read, Write]
    permission_mode: acceptEdits
    output: status.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.1.0
tags: [communication, tickets, mcp-jira, claude]
