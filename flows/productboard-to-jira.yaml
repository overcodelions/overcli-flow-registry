name: "Productboard feature → Jira tickets"
description: "Read a Productboard feature URL or description, break it into an epic + stories, then create them on approval"
input: user_prompt
default_prompt: |-
  Convert this Productboard feature into Jira tickets:

  <paste Productboard URL here>
participants:
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: planner
    name: Planner
    backend: claude
    model: claude-opus-5
    kind: reviewer
  - id: writer
    name: Writer
    backend: claude
    model: claude-sonnet-5
    kind: worker
steps:
  - id: read
    participant: scout
    role: researcher
    inputs: [user_prompt]
    tools: [WebFetch]
    output: feature.md
  - id: breakdown
    participant: planner
    role: planner
    inputs: [user_prompt, feature.md]
    tools: [Read, Grep, Glob]
    output: breakdown.md
  - id: draft
    participant: writer
    role: technical-writer
    inputs: [user_prompt, feature.md, breakdown.md]
    tools: [Read]
    output: tickets-draft.md
  - id: create
    participant: scout
    role: shipper
    inputs: [user_prompt, breakdown.md, tickets-draft.md]
    tools: [mcp:atlassian]
    pause_before: true
    output: tickets.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.1.0
tags: [planning, roadmap, productboard, mcp-jira, claude]
