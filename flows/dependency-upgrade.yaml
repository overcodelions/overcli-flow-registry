name: "Upgrade a dependency"
description: "Research a dependency's breaking changes, upgrade it, then fix and verify in a loop until the build, types and tests pass with no deprecated calls left, and write up what changed"
input: user_prompt
default_prompt: |-
  Upgrade: <package name>
  To: <version, or "latest">
participants:
  - id: lead
    name: Lead
    backend: claude
    model: claude-opus-5-5
    kind: primary
  - id: builder
    name: Builder
    backend: codex
    model: gpt-6.1-terra
    kind: worker
  - id: writer
    name: Writer
    backend: claude
    model: claude-sonnet-5-5
    kind: custom
steps:
  - id: research
    participant: lead
    role: researcher
    system_prompt: |-
      Find the current version and how the project uses the dependency
      (every import and call site). Read its changelog, release notes and
      migration guides between the current and target versions, and list
      every breaking change, deprecation and new peer requirement that
      touches this project's usage, with links. Change nothing.
    inputs: [user_prompt]
    tools: [Read, Grep, Glob, Bash, WebFetch]
    effect: local
    output: research.md
  - id: plan
    participant: lead
    role: planner
    inputs: [user_prompt, research.md]
    tools: [Read, Grep, Glob]
    effect: local
    output: plan.md
  - id: upgrade
    participant: builder
    role: implementer
    system_prompt: |-
      Upgrade the dependency to the target version with the project's own
      package manager so the lockfile updates, including any peer
      dependencies the research names, then apply the planned migration at
      every call site. Don't upgrade anything else.
    inputs: [user_prompt, research.md, plan.md]
    tools: [Read, Glob, Grep, Write, Edit, Bash]
    effect: local
    output: diff
  - id: fix
    participant: builder
    role: custom
    system_prompt: |-
      You are the FIX step. It runs once, and again each time the VERIFY
      step sends the work back. Run the build, type check, lint and tests,
      and fix what the upgrade broke. If VERIFY sent you back, fix exactly
      what it named. Don't pin back to the old version or silence errors to
      get green. Quote the result lines.
    inputs: [user_prompt, research.md, plan.md, diff]
    tools: [Read, Glob, Grep, Write, Edit, Bash]
    effect: local
    output: diff
  - id: verify
    participant: lead
    role: custom
    verdict_gate: true
    system_prompt: |-
      You are the VERIFY step. Check by running: the lockfile resolves the
      target version, and the build, type check, lint and tests pass. Search
      for every deprecated or removed API the research listed: none may be
      left. Suppressed errors, skipped tests or a pinned-back version are
      blocking.

      End with a line that is exactly APPROVED if nothing is blocking,
      otherwise CHANGES REQUESTED — that sends the work back to FIX.
    inputs: [user_prompt, research.md, plan.md, diff]
    tools: [Read, Grep, Glob, Bash]
    effect: local
    on_fail:
      action: goto
      target: fix
      max_retries: 4
    output: verify.md
  - id: report
    participant: writer
    role: technical-writer
    inputs: [user_prompt, research.md, diff, verify.md]
    tools: [Read, Grep, Glob]
    effect: local
    output: report.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.0.0
tags: [migration, implementation, testing, repo, claude, codex]
