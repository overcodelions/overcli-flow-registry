name: "Triage GitHub issue"
description: "Fetch the issue, explore the repo, diagnose, then propose a resolution + labels"
input: user_prompt
default_prompt: |-
  Triage this GitHub issue:

  <paste issue URL or number here>
participants:
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: explorer
    name: Explorer
    backend: claude
    model: claude-sonnet-5
    kind: worker
  - id: diagnostician
    name: Diagnostician
    backend: claude
    model: claude-opus-5
    kind: reviewer
steps:
  - id: fetch
    participant: scout
    role: researcher
    inputs: [user_prompt]
    tools: [Bash, WebFetch]
    output: issue.md
  - id: explore
    participant: explorer
    role: researcher
    inputs: [user_prompt, issue.md]
    tools: [Read, Grep, Glob, Bash]
    output: research.md
  - id: diagnose
    participant: diagnostician
    role: debugger
    inputs: [user_prompt, issue.md, research.md]
    tools: [Read, Grep, Glob, Bash]
    output: diagnosis.md
  - id: propose
    participant: explorer
    role: technical-writer
    inputs: [user_prompt, issue.md, diagnosis.md]
    tools: [Read, Write]
    permission_mode: acceptEdits
    output: triage.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.1.0
tags: [triage, issues, repo, claude]
