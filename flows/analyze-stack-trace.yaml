name: "Analyze stack trace"
description: "Parse the trace, locate frames in the codebase, diagnose root cause, then propose a fix"
input: user_prompt
default_prompt: |-
  Analyze this stack trace and propose a fix:

  <paste stack trace here>
participants:
  - id: parser
    name: Parser
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: locator
    name: Locator
    backend: claude
    model: claude-sonnet-5
    kind: custom
  - id: diagnostician
    name: Diagnostician
    backend: claude
    model: claude-opus-5
    kind: reviewer
  - id: fixer
    name: Fixer
    backend: codex
    model: gpt-5.6-terra
    kind: worker
steps:
  - id: parse
    participant: parser
    role: researcher
    inputs: [user_prompt]
    tools: []
    output: frames.md
  - id: locate
    participant: locator
    role: researcher
    inputs: [user_prompt, frames.md]
    tools: [Read, Grep, Glob]
    output: locations.md
  - id: diagnose
    participant: diagnostician
    role: debugger
    inputs: [user_prompt, frames.md, locations.md]
    tools: [Read, Grep, Glob]
    output: diagnosis.md
  - id: propose-fix
    participant: fixer
    role: implementer
    inputs: [user_prompt, diagnosis.md, locations.md]
    tools: [Read, Glob, Grep, Write, Edit, Bash]
    output: fix.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.1.0
tags: [debugging, logs, repo, claude, codex]
