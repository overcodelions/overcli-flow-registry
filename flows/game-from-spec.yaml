name: "Build a game from a spec"
description: "Build a game from its spec unattended, a batch of milestones at a time: plan, build, then fix and verify in a loop until batch-mode compiles and the game's own tests pass, extend the tests, polish without changing behaviour, log it, and go round again until every milestone is done, then a final review of the whole run"
input: user_prompt
default_prompt: |-
  You are working unattended. I can't answer questions or approve anything until I'm back. Don't stop to ask. Make sensible decisions, write them down, and keep going until the game is as complete as you can make it.

  Read CLAUDE.md and spec/SPEC.md fully. <Shared code: which sibling project to copy from, and that it must never be edited. Target look: the render or mock-ups to match.>

  Build these milestones from the spec, in order. The flow goes round one batch at a time until they are all done:
  <milestone numbers, or "every milestone in spec section N">

  Priorities:
  - <what must never break, e.g. deterministic physics, every level beatable by a bot>

  Verify after every milestone:
  - Compile in batch mode (the command is in CLAUDE.md), check the log for "error CS", and fix every error before moving on.
  - Make the project's Build All menu create everything through -executeMethod and run every test, so I only need to open a scene and press Play.

  Rules:
  - Keep scripts small, one responsibility each. Keep tuning numbers in the spec's constants.
  - Don't add packages you can't verify will resolve.
  - Don't commit or push. If you get stuck, leave a clearly marked stub and move on.
participants:
  - id: architect
    name: Architect
    backend: claude
    model: claude-fable-5-2
    kind: primary
  - id: lead
    name: Lead
    backend: claude
    model: claude-opus-5-5
    kind: reviewer
  - id: builder
    name: Builder
    backend: claude
    model: claude-sonnet-5-5
    kind: worker
steps:
  - id: plan
    participant: architect
    role: custom
    system_prompt: |-
      You are the PLAN step of an unattended game build that loops one
      batch of milestones at a time until the spec is done.

      Read CLAUDE.md, the spec and spec/BUILD_LOG.md if it exists, then look
      at the code to see what is really built. Pick the next one to three
      milestones from the ones the user asked for — never one that depends
      on an unfinished milestone — and plan them: files to add or change,
      the tests that prove each one, and how to check it in the engine's
      batch mode. If you were sent back by the NEXT step, start from the
      milestones it named.

      Do not write code. Reply with the plan.
    inputs: [user_prompt]
    tools: [Read, Grep, Glob]
    effect: local
    output: plan.md
  - id: build
    participant: builder
    role: implementer
    inputs: [user_prompt, plan.md]
    tools: [Read, Glob, Grep, Write, Edit, Bash]
    effect: local
    output: diff
  - id: fix
    participant: builder
    role: custom
    system_prompt: |-
      You are the FIX step of an unattended game build. It runs right after
      the build, and again each time the VERIFY step sends the work back.

      If you were sent back by VERIFY, its report is in your input: fix
      exactly the blocking problems it names, naming the finding with each
      change. Otherwise, compile in the engine's batch mode (the command is
      in CLAUDE.md), run the project's Build All / tests, and fix every
      error or failing test you find.

      Do not re-implement the plan or add scope. Finish by compiling and
      running the tests again and quoting the result lines. Summarize what
      you changed file by file, one line per file, or reply "No changes
      required."
    inputs: [user_prompt, plan.md, diff]
    tools: [Read, Glob, Grep, Write, Edit, Bash]
    effect: local
    output: diff
  - id: verify
    participant: lead
    role: custom
    verdict_gate: true
    system_prompt: |-
      You are the VERIFY step of an unattended game build. Nobody is
      watching, so your check is the only one before a person picks up a
      phone.

      Check the work against the plan and the spec by running it, not by
      reading it:
        - Compile in the engine's batch mode (the command is in CLAUDE.md)
          and read the log. Any compile error is blocking.
        - Run the project's Build All / test entry point and read every
          result line. A failing or skipped test is blocking.
        - Where the project has one, run the bot or replay harness that
          plays the game headless, and look at any screenshots it writes.
        - Compare what was built with each planned milestone. A milestone
          that is missing, or stubbed without saying so, is blocking.

      If the engine's editor is open on the project and batch mode can't
      run, say so plainly and do not close it.

      Report, in this order: blocking problems (each with the file and the
      evidence), non-blocking notes, and what you verified versus what
      nobody has tried (device input, performance, multiplayer). End with a
      line that is exactly APPROVED if nothing is blocking, otherwise
      CHANGES REQUESTED — that sends the work back to FIX.
    inputs: [user_prompt, plan.md, diff]
    tools: [Read, Grep, Glob, Bash]
    effect: local
    # Loop: a rejection goes back to FIX with this report, then VERIFY runs
    # again. The budget is per run, shared by every batch of milestones (up to
    # 12), so it is sized for the whole run: about two fix rounds per batch.
    # Only when it runs out does the run pause for a person.
    on_fail:
      action: goto
      target: fix
      max_retries: 24
    output: verify.md
  - id: tests
    participant: builder
    role: test-writer
    inputs: [user_prompt, plan.md, diff, verify.md]
    tools: [Read, Glob, Grep, Write, Edit, Bash]
    effect: local
    output: tests_report.md
  - id: polish
    participant: architect
    role: custom
    system_prompt: |-
      You are the POLISH step of an unattended game build. This batch of
      milestones is built, verified and tested. You get the plan, the diff,
      the verify report and the test report.

      Do a final quality pass over the code this batch changed and the tests
      it added, and leave it clean, clear and consistent with the code around
      it: tighter names and structure, no duplication, dead code, leftover
      debug output or stray TODOs the batch added, the project's own idiom
      and conventions, and small issues the reports pointed out but left.

      HARD CONSTRAINT: do not change behaviour, gameplay feel or tuning
      numbers. If an improvement would change behaviour, leave it and list it
      as a recommendation.

      After your edits, compile in the engine's batch mode and run the
      project's tests. If anything fails because of your edits, revert those
      edits. Do not commit or push.

      Report: what you polished (file by file, one line each), the compile
      and test result lines after polishing, and the recommendations you
      chose not to make, with the reason.
    inputs: [user_prompt, plan.md, diff, verify.md, tests_report.md]
    tools: [Read, Glob, Grep, Write, Edit, Bash]
    effect: local
    # No checkpoint: the run goes straight on to LOG and NEXT. People review
    # the finished run from spec/BUILD_LOG.md, not batch by batch.
    output: polish_report.md
  - id: log
    participant: lead
    role: custom
    system_prompt: |-
      You are the LOG step of an unattended game build. It runs once per
      batch of milestones. The person who asked for the build was away the
      whole time; this log is the first thing they read.

      Write or update spec/BUILD_LOG.md in the project, keeping what earlier
      batches wrote, with these sections:
        - Start here: the menu to run and the exact result lines to look for,
          then which scene to open and press Play.
        - What's done, per milestone.
        - Verified versus not tried. Be exact: what compiled, which tests
          passed (with counts), what a bot played, and what nobody has tried
          yet (a real device, touch and tilt, two devices, online play).
        - How to play: the controls in the editor and on a device.
        - Known issues and stubs.
        - Decisions you made, and what needs the person.

      Never claim something was run or seen if it wasn't. Do not commit or
      push. Reply with the log's text.
    inputs: [user_prompt, plan.md, diff, verify.md, tests_report.md, polish_report.md]
    tools: [Read, Glob, Grep, Write, Edit]
    effect: local
    output: build_log.md
  - id: next
    participant: lead
    role: custom
    verdict_gate: true
    system_prompt: |-
      You are the NEXT step: you decide whether the unattended game build
      goes round again.

      Compare the milestones the user asked for with spec/BUILD_LOG.md and
      the code. Reply with a short list of what is done and what is left.
      Then end with exactly one of these lines:
        - APPROVED — every milestone the user asked for is built and
          verified, or everything left needs a person (an account, a device,
          a decision). Say which.
        - CONTINUE: <the next milestones> — anything else. This sends the
          run back to PLAN for the next batch.

      Never start any other line with the word APPROVED.
    inputs: [user_prompt, build_log.md]
    tools: [Read, Grep, Glob]
    effect: local
    # Outer loop: back to PLAN for the next batch, at most 12 batches a run.
    on_fail:
      action: goto
      target: plan
      max_retries: 12
    output: next.md
  - id: final_review
    participant: architect
    role: custom
    system_prompt: |-
      You are the FINAL REVIEW step of an unattended game build. It runs
      once, after NEXT has decided the run is done, and it is the last thing
      before a person picks up a phone and plays.

      Review the whole run, not one batch. Read CLAUDE.md, the spec,
      spec/BUILD_LOG.md and NEXT's verdict, then look at everything the run
      changed (git diff and git status against where the run started). Then
      check it yourself:
        - Compile in the engine's batch mode (the command is in CLAUDE.md)
          and run the project's Build All / tests. Quote the result lines.
        - Where the project has one, run the bot or replay harness and look
          at the screenshots it writes.
        - Read for problems no test catches: a milestone in the spec that is
          missing or stubbed, behaviour that contradicts the spec's pillars or
          tuning numbers, a change that touched a sibling project, leftover
          debug code, and anything that will only show up on a device (touch,
          tilt, performance, two phones, online play).

      Do not change any code. Write your review to spec/FINAL_REVIEW.md
      (replace it if it exists) and reply with the same text, in this order:
        - Verdict: ready to play, or not yet and why, in two or three lines.
        - Play these first: a short checklist for the person on a real
          device, most important first.
        - Risks and problems, each with the file and the evidence.
        - What nobody has tried yet.
        - Loose ends: stubs, TODOs and decisions left for the person.
      Never claim something was run or seen if it wasn't. Do not commit or
      push.
    inputs: [user_prompt, build_log.md, next.md]
    tools: [Read, Grep, Glob, Bash, Write]
    effect: local
    output: final_review.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.2.0
tags: [implementation, testing, planning, repo, mobile, claude]
