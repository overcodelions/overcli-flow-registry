name: "Triage customer feedback"
description: "Read customer feedback (email/transcript/blob), search Jira for duplicates, draft a ticket, then file it on approval"
input: user_prompt
default_prompt: |-
  Triage this customer feedback:

  <paste feedback here>
participants:
  - id: analyst
    name: Analyst
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: dedupe
    name: Duplicate hunter
    backend: claude
    model: claude-sonnet-5
    kind: worker
  - id: author
    name: Author
    backend: claude
    model: claude-opus-5
    kind: reviewer
steps:
  - id: triage
    participant: analyst
    role: researcher
    inputs: [user_prompt]
    tools: [WebFetch]
    output: feedback.md
  - id: dupes
    participant: dedupe
    role: researcher
    inputs: [user_prompt, feedback.md]
    tools: [mcp:atlassian]
    output: dupes.md
  - id: draft
    participant: author
    role: technical-writer
    inputs: [user_prompt, feedback.md, dupes.md]
    tools: [Read]
    output: draft.md
  - id: file
    participant: analyst
    role: shipper
    inputs: [user_prompt, dupes.md, draft.md]
    tools: [mcp:atlassian]
    pause_before: true
    output: ticket.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.1.0
tags: [triage, feedback, tickets, mcp-jira, claude]
