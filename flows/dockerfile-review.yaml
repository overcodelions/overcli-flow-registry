name: "Dockerfile review"
description: "Read the Dockerfile and context, review for size/security/cache issues, then draft concrete fixes"
input: user_prompt
default_prompt: "Review the Dockerfile(s) in this repo for correctness, security, and image size."
participants:
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: reviewer
    name: Reviewer
    backend: claude
    model: claude-opus-5
    kind: reviewer
  - id: fixer
    name: Fixer
    backend: codex
    model: gpt-5.6-terra
    kind: worker
steps:
  - id: read
    participant: scout
    role: researcher
    inputs: [user_prompt]
    tools: [Read, Grep, Glob]
    output: context.md
  - id: review
    participant: reviewer
    role: reviewer
    inputs: [user_prompt, context.md]
    tools: [Read, Grep, WebFetch]
    output: findings.md
  - id: suggest-fixes
    participant: fixer
    role: implementer
    inputs: [user_prompt, context.md, findings.md]
    tools: [Read, Glob, Write, Edit]
    permission_mode: acceptEdits
    output: review.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.1.0
tags: [review, infra, devops, claude, codex]
