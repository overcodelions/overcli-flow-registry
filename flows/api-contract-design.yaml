name: "API contract design"
description: "Research existing endpoints, design the new contract, draft schemas, then adversarially review"
input: user_prompt
default_prompt: |-
  Design the API contract for:

  <describe the feature/endpoints here>
participants:
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: architect
    name: Architect
    backend: claude
    model: claude-fable-5
    kind: custom
  - id: writer
    name: Schema author
    backend: codex
    model: gpt-5.6-terra
    kind: worker
  - id: reviewer
    name: Reviewer
    backend: claude
    model: claude-opus-5
    kind: reviewer
steps:
  - id: research
    participant: scout
    role: researcher
    inputs: [user_prompt]
    tools: [Read, Grep, Glob]
    output: research.md
  - id: design
    participant: architect
    role: planner
    inputs: [user_prompt, research.md]
    tools: [Read, Grep, Glob]
    output: design.md
  - id: schema
    participant: writer
    role: implementer
    inputs: [user_prompt, design.md]
    tools: [Read, Glob, Write, Edit]
    permission_mode: acceptEdits
    output: schema.md
  - id: review
    participant: reviewer
    role: adversarial-reviewer
    inputs: [user_prompt, design.md, schema.md]
    tools: [Read, Grep, Glob]
    output: contract.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.1.0
tags: [design, api, docs, backend, claude, codex]
