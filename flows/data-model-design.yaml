name: "Data model design"
description: "Research existing schema, design new tables/indexes/constraints, draft DDL, then review for safety"
input: user_prompt
default_prompt: |-
  Design the data model for:

  <describe the feature here>
participants:
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: architect
    name: Architect
    backend: claude
    model: claude-fable-5
    kind: custom
  - id: writer
    name: DDL author
    backend: codex
    model: gpt-5.6-terra
    kind: worker
  - id: reviewer
    name: Reviewer
    backend: claude
    model: claude-opus-5
    kind: reviewer
steps:
  - id: research
    participant: scout
    role: researcher
    inputs: [user_prompt]
    tools: [Read, Grep, Glob]
    output: research.md
  - id: design
    participant: architect
    role: planner
    inputs: [user_prompt, research.md]
    tools: [Read, Grep, Glob]
    output: design.md
  - id: ddl
    participant: writer
    role: implementer
    inputs: [user_prompt, design.md]
    tools: [Read, Glob, Write, Edit]
    permission_mode: acceptEdits
    output: ddl.md
  - id: review
    participant: reviewer
    role: reviewer
    inputs: [user_prompt, design.md, ddl.md]
    tools: [Read, Grep, Glob]
    output: model.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.1.0
tags: [design, data, repo, backend, claude, codex]
