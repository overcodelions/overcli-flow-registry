name: "Terraform plan review"
description: "Parse the plan, assess blast radius and rollback, then format a risk-ranked report"
input: user_prompt
default_prompt: |-
  Review this Terraform plan:

  <paste plan output here>
participants:
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: reviewer
    name: Reviewer
    backend: claude
    model: claude-opus-5
    kind: reviewer
  - id: writer
    name: Writer
    backend: claude
    model: claude-sonnet-5
    kind: worker
steps:
  - id: parse
    participant: scout
    role: researcher
    inputs: [user_prompt]
    tools: [Read, Grep, Glob]
    output: parsed.md
  # Reviewer-role steps GATE the run: the runtime treats "no APPROVED line"
  # as a step failure. Flagging a risky apply is this step's job, not a
  # failure, so it hands off forward rather than parking the run and leaving
  # `format` unreachable.
  - id: blast-radius
    participant: reviewer
    role: reviewer
    inputs: [user_prompt, parsed.md]
    tools: [Read, Grep, Glob]
    on_fail:
      action: goto
      target: format
      max_retries: 1
    output: risk.md
  - id: format
    participant: writer
    role: technical-writer
    inputs: [user_prompt, risk.md]
    tools: [Read, Write]
    permission_mode: acceptEdits
    output: review.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.2.0
tags: [review, infra, devops, claude]
