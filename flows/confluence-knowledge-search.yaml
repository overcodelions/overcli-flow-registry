name: "Search company knowledge"
description: "Fan out searches across Confluence + Jira, deep-read top hits, then synthesize a cited answer"
input: user_prompt
default_prompt: |-
  Search company knowledge for:

  <your question here>
participants:
  - id: searcher
    name: Searcher
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: reader
    name: Reader
    backend: claude
    model: claude-opus-5
    kind: reviewer
  - id: writer
    name: Writer
    backend: claude
    model: claude-sonnet-5
    kind: worker
steps:
  - id: search
    participant: searcher
    role: researcher
    inputs: [user_prompt]
    tools: [mcp:atlassian]
    output: hits.md
  - id: deep-read
    participant: reader
    role: researcher
    inputs: [user_prompt, hits.md]
    tools: [mcp:atlassian]
    output: notes.md
  - id: synthesize
    participant: writer
    role: technical-writer
    inputs: [user_prompt, hits.md, notes.md]
    tools: [Read, Write]
    permission_mode: acceptEdits
    output: answer.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.1.0
tags: [research, confluence, mcp-confluence, mcp-jira, claude]
