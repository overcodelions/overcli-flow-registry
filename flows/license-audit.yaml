name: "License audit"
description: "Inventory dep licenses + repo LICENSE files, analyze for conflicts, then format an audit report"
input: user_prompt
default_prompt: "Audit all project dependencies for license compliance and compatibility."
participants:
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: analyst
    name: Analyst
    backend: claude
    model: claude-opus-5
    kind: reviewer
  - id: writer
    name: Writer
    backend: claude
    model: claude-sonnet-5
    kind: worker
steps:
  - id: inventory
    participant: scout
    role: researcher
    inputs: [user_prompt]
    tools: [Bash, Read, Glob]
    output: inventory.md
  - id: analyze
    participant: analyst
    role: reviewer
    inputs: [user_prompt, inventory.md]
    tools: [Read, WebFetch]
    output: analysis.md
  - id: format
    participant: writer
    role: technical-writer
    inputs: [user_prompt, analysis.md]
    tools: [Read, Write]
    permission_mode: acceptEdits
    output: audit.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.1.0
tags: [operations, security, repo, devops, claude]
