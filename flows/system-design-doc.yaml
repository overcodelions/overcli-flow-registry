name: "System design doc"
description: "Research the area, design alternatives, draft a full design doc, then adversarially review"
input: user_prompt
default_prompt: |-
  Write a system design doc for:

  <describe the system here>
participants:
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: architect
    name: Architect
    backend: claude
    model: claude-fable-5
    kind: custom
  - id: writer
    name: Writer
    backend: codex
    model: gpt-5.6-terra
    kind: worker
  - id: reviewer
    name: Reviewer
    backend: claude
    model: claude-opus-5
    kind: reviewer
steps:
  - id: research
    participant: scout
    role: researcher
    inputs: [user_prompt]
    tools: [Read, Grep, Glob, WebFetch]
    output: research.md
  - id: design
    participant: architect
    role: planner
    inputs: [user_prompt, research.md]
    tools: [Read, Grep, Glob]
    output: design.md
  - id: draft
    participant: writer
    role: technical-writer
    inputs: [user_prompt, research.md, design.md]
    tools: [Read, Glob, Write]
    permission_mode: acceptEdits
    output: draft.md
  - id: review
    participant: reviewer
    role: adversarial-reviewer
    inputs: [user_prompt, design.md, draft.md]
    tools: [Read, Grep, Glob]
    output: design-doc.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.1.0
tags: [design, docs, claude, codex]
