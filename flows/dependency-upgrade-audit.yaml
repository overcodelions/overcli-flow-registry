name: "Dependency upgrade audit"
description: "Scan installed deps, cross-check vulnerability feeds, analyze breakage risk, then format an upgrade plan"
input: user_prompt
default_prompt: "Analyze all outdated dependencies for security vulnerabilities and upgrade risk, then recommend safe upgrade strategies."
participants:
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: analyst
    name: Analyst
    backend: claude
    model: claude-opus-5
    kind: reviewer
  - id: writer
    name: Writer
    backend: claude
    model: claude-sonnet-5
    kind: worker
steps:
  - id: scan
    participant: scout
    role: researcher
    inputs: [user_prompt]
    tools: [Bash, Read, Glob]
    output: outdated.md
  - id: vuln
    participant: scout
    role: researcher
    inputs: [user_prompt, outdated.md]
    tools: [WebFetch, Bash]
    output: vulns.md
  - id: analyze
    participant: analyst
    role: planner
    inputs: [user_prompt, outdated.md, vulns.md]
    tools: [Read, Grep, Glob]
    output: analysis.md
  - id: format
    participant: writer
    role: technical-writer
    inputs: [user_prompt, analysis.md]
    tools: [Read, Write]
    permission_mode: acceptEdits
    output: audit.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.1.0
tags: [operations, security, repo, devops, claude]
