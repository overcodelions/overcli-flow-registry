name: "Security review"
description: "Map the diff, scan for OWASP-style issues, adversarially verify each finding with a fresh reviewer, then format a report"
input: user_prompt
default_prompt: "Run a security review on the current branch's changes."
participants:
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: scanner
    name: Scanner
    backend: claude
    model: claude-opus-5
    kind: custom
  - id: verifier
    name: Verifier
    backend: claude
    model: claude-opus-5
    kind: reviewer
  - id: writer
    name: Writer
    backend: claude
    model: claude-sonnet-5
    kind: worker
steps:
  - id: map
    participant: scout
    role: researcher
    inputs: [user_prompt]
    tools: [Bash, Read, Grep, Glob]
    output: map.md
  # Reviewer-role steps GATE the run: the runtime treats "no APPROVED line"
  # as a step failure. For a flow whose whole deliverable is a list of
  # findings, finding something is the expected outcome, not a failure — so
  # each reviewer hands off forward instead of parking the run and leaving
  # `format` unreachable.
  - id: scan
    participant: scanner
    role: security-reviewer
    inputs: [user_prompt, map.md]
    tools: [Read, Grep, Glob, Bash]
    on_fail:
      action: goto
      target: verify
      max_retries: 1
    output: findings.md
  - id: verify
    participant: verifier
    role: adversarial-reviewer
    inputs: [user_prompt, map.md, findings.md]
    tools: [Read, Grep, Glob, Bash]
    on_fail:
      action: goto
      target: format
      max_retries: 1
    output: verified.md
  - id: format
    participant: writer
    role: technical-writer
    inputs: [user_prompt, verified.md]
    tools: [Read, Write]
    permission_mode: acceptEdits
    output: review.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.2.0
tags: [security, review, repo, claude]
