name: "Dead-code finder"
description: "Scan for unreferenced symbols, verify each candidate is truly dead, then format a deletion plan"
input: user_prompt
default_prompt: "Find unused code, exports, and modules in this repo."
participants:
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: verifier
    name: Verifier
    backend: claude
    model: claude-opus-5
    kind: reviewer
  - id: writer
    name: Writer
    backend: claude
    model: claude-sonnet-5
    kind: worker
steps:
  - id: scan
    participant: scout
    role: researcher
    inputs: [user_prompt]
    tools: [Bash, Read, Grep, Glob]
    output: candidates.md
  # Reviewer-role steps GATE the run: the runtime treats "no APPROVED line"
  # as a step failure. Refuting a dead-code candidate is this step's job, not
  # a failure, so it hands off forward rather than parking the run and
  # leaving `format` unreachable.
  - id: verify
    participant: verifier
    role: adversarial-reviewer
    inputs: [user_prompt, candidates.md]
    tools: [Bash, Read, Grep, Glob]
    on_fail:
      action: goto
      target: format
      max_retries: 1
    output: verified.md
  - id: format
    participant: writer
    role: technical-writer
    inputs: [user_prompt, verified.md]
    tools: [Read, Write]
    permission_mode: acceptEdits
    output: report.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.2.0
tags: [refactor, repo, analysis, claude]
