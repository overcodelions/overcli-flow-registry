name: "Support ticket → Jira bug"
description: "Convert a support ticket (Zendesk/email blob) into a well-structured Jira bug after checking for duplicates, then file it on approval"
input: user_prompt
default_prompt: |-
  Convert this support ticket into a bug report:

  <paste support ticket here>
participants:
  - id: analyst
    name: Analyst
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: dedupe
    name: Duplicate hunter
    backend: claude
    model: claude-sonnet-5
    kind: worker
  - id: author
    name: Author
    backend: claude
    model: claude-opus-5
    kind: reviewer
steps:
  - id: analyze
    participant: analyst
    role: researcher
    inputs: [user_prompt]
    tools: [WebFetch]
    output: analysis.md
  - id: dupes
    participant: dedupe
    role: researcher
    inputs: [user_prompt, analysis.md]
    tools: [mcp:atlassian]
    output: dupes.md
  - id: draft
    participant: author
    role: technical-writer
    inputs: [user_prompt, analysis.md, dupes.md]
    tools: [Read]
    output: draft.md
  - id: file
    participant: analyst
    role: shipper
    inputs: [user_prompt, dupes.md, draft.md]
    tools: [mcp:atlassian]
    pause_before: true
    output: ticket.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.1.0
tags: [triage, feedback, tickets, mcp-jira, claude]
