name: "Sprint retrospective"
description: "Pull sprint tickets, analyze wins/blockers/themes, then draft a retro doc"
input: user_prompt
default_prompt: "Analyze the completed sprint tickets and draft a retrospective covering what went well, what didn't, and action items."
participants:
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: analyst
    name: Analyst
    backend: claude
    model: claude-opus-5
    kind: reviewer
  - id: writer
    name: Writer
    backend: claude
    model: claude-sonnet-5
    kind: worker
steps:
  - id: fetch
    participant: scout
    role: researcher
    inputs: [user_prompt]
    tools: [mcp:atlassian]
    output: tickets.md
  - id: analyze
    participant: analyst
    role: researcher
    inputs: [user_prompt, tickets.md]
    tools: [mcp:atlassian]
    output: analysis.md
  - id: draft
    participant: writer
    role: technical-writer
    inputs: [user_prompt, tickets.md, analysis.md]
    tools: [Read, Write]
    permission_mode: acceptEdits
    output: retro.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.1.0
tags: [analysis, tickets, mcp-jira, claude]
