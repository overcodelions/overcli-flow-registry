name: "Data migration plan"
description: "Survey current schema + scale, design an online migration with rollback, draft scripts, then review for safety"
input: user_prompt
default_prompt: |-
  Plan a data migration:

  <describe the migration here>
participants:
  - id: scout
    name: Scout
    backend: claude
    model: claude-sonnet-5
    kind: primary
  - id: architect
    name: Architect
    backend: claude
    model: claude-fable-5
    kind: custom
  - id: writer
    name: Script author
    backend: codex
    model: gpt-5.6-terra
    kind: worker
  - id: reviewer
    name: Reviewer
    backend: claude
    model: claude-opus-5
    kind: reviewer
steps:
  - id: survey
    participant: scout
    role: researcher
    inputs: [user_prompt]
    tools: [Read, Grep, Glob, Bash]
    output: survey.md
  - id: design
    participant: architect
    role: planner
    inputs: [user_prompt, survey.md]
    tools: [Read, Grep, Glob]
    output: design.md
  - id: scripts
    participant: writer
    role: implementer
    inputs: [user_prompt, design.md]
    tools: [Read, Glob, Write, Edit]
    permission_mode: acceptEdits
    output: scripts.md
  - id: review
    participant: reviewer
    role: adversarial-reviewer
    inputs: [user_prompt, design.md, scripts.md]
    tools: [Read, Grep, Glob]
    output: plan.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.1.0
tags: [migration, planning, data, repo, claude, codex]
