name: "App Store release prep"
description: "Get an iOS app ready for TestFlight or App Store review: bump the version, fix and re-audit local release blockers in a loop, then write the release notes and a checklist of what only a person can do"
input: user_prompt
default_prompt: |-
  Get this app ready for: <TestFlight | App Store review>

  New version: <e.g. 1.0.0, or "bump the patch">
  Anything to know: <engine (Unity, native), bundle id, what changed since the last build>

  Don't touch signing, certificates, my Apple account or App Store Connect. Don't commit or push.
participants:
  - id: lead
    name: Lead
    backend: claude
    model: claude-opus-5-5
    kind: primary
  - id: builder
    name: Builder
    backend: claude
    model: claude-sonnet-5-5
    kind: worker
steps:
  - id: gather
    participant: lead
    role: researcher
    inputs: [user_prompt]
    tools: [Read, Grep, Glob, Bash]
    effect: local
    output: release_facts.md
  - id: fix
    participant: builder
    role: custom
    system_prompt: |-
      You are the FIX step of an iOS release prep. It runs once, and again
      each time the AUDIT step sends the work back.

      If AUDIT sent you back, fix exactly the blockers it names. Otherwise
      set the new version and build number where the project keeps them,
      then go through the release blockers you can fix locally: debug flags
      and logging left on, test or placeholder ad and analytics ids where a
      release needs real ones (flag, don't invent), missing app icon sizes or
      launch screen, a missing or incomplete privacy manifest
      (PrivacyInfo.xcprivacy) and usage-description strings, export
      compliance (ITSAppUsesNonExemptEncryption), orientation and device
      family settings, and a build that doesn't compile in release.

      Never touch signing, certificates, provisioning, the Apple account or
      App Store Connect. Summarize what you changed file by file, and list
      what you could not fix.
    inputs: [user_prompt, release_facts.md]
    tools: [Read, Glob, Grep, Write, Edit, Bash]
    effect: local
    output: diff
  - id: audit
    participant: lead
    role: custom
    verdict_gate: true
    system_prompt: |-
      You are the AUDIT step of an iOS release prep. Re-check every release
      blocker by reading the project and, where possible, building it in
      release: version and build number set and higher than the last build;
      no debug flags, test ad ids or placeholder keys in a release path;
      every required icon size; privacy manifest and usage strings for each
      API and SDK used; export compliance declared; orientation and device
      family match the app.

      Things only a person can do (signing, App Store Connect records,
      screenshots upload) are not blockers here; list them separately.

      End with a line that is exactly APPROVED if nothing local is blocking,
      otherwise CHANGES REQUESTED with the blockers — that sends the work
      back to FIX.
    inputs: [user_prompt, release_facts.md, diff]
    tools: [Read, Grep, Glob, Bash]
    effect: local
    on_fail:
      action: goto
      target: fix
      max_retries: 2
    output: audit.md
  - id: notes
    participant: builder
    role: technical-writer
    system_prompt: |-
      Write the release copy from the facts and the changes since the last
      build: App Store "What's New" text (short, player-facing, no internal
      names), TestFlight "What to Test" notes for testers, and App Review
      notes (how to reach every feature, demo account or none needed,
      anything unusual like same-Wi-Fi multiplayer). Keep each to the
      length App Store Connect allows.
    inputs: [user_prompt, release_facts.md, audit.md]
    tools: [Read, Grep, Glob]
    effect: local
    output: release_notes.md
  - id: checklist
    participant: lead
    role: technical-writer
    system_prompt: |-
      Write the final hand-off: a short checklist of what only a person can
      do, in order — archive and upload, signing, the App Store Connect
      record and age rating, screenshots per required device size, privacy
      nutrition labels matching the privacy manifest, pricing, in-app
      purchases and Game Center if used, then submit. Mark what the audit
      already confirmed. End with the exact files this run changed.
    inputs: [user_prompt, release_facts.md, diff, audit.md, release_notes.md]
    tools: [Read, Grep, Glob]
    effect: local
    output: release_checklist.md
author: { name: "Overcli", url: "https://github.com/overcodelions/overcli" }
version: 1.0.0
tags: [release, documentation, mobile, repo, claude]
